name: Pipeline - reusable run

on:
  workflow_call:
    inputs:
      fase:
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar fase "${{ inputs.fase }}"
        working-directory: Pipeline
        env:
          WINFORCE_USUARIO: ${{ secrets.WINFORCE_USUARIO }}
          WINFORCE_PASSWORD: ${{ secrets.WINFORCE_PASSWORD }}
          ALIV_SISTEMA_USUARIO: ${{ secrets.ALIV_SISTEMA_USUARIO }}
          ALIV_SISTEMA_PASSWORD: ${{ secrets.ALIV_SISTEMA_PASSWORD }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python run_pipeline.py ${{ inputs.fase }}

      - name: Guardar PDF generado (si hubo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ inputs.fase }}-${{ github.run_id }}
          path: |
            Pipeline/scripts/*.pdf
            Pipeline/logs/*.log
          if-no-files-found: ignore
          retention-days: 30
